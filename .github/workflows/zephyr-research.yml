name: Zephyr research tools
on:
  push:
    branches: [research/android-x360-foundation, research/android-x360-gpu-candidate, perf/edge30-beta1, research/edge30-diagnostics-audit-20261117, research/native-recomp-semantics-20261118, research/army-tdc-native-hotpath-20261118]
    paths:
      - 'tools/compare-benchmarks.py'
      - 'tools/test-compare-benchmarks.py'
      - 'tools/zephyr-graphics-ab.py'
      - 'tools/test-zephyr-graphics-ab.py'
      - 'tools/scheduler-diagnostics.py'
      - 'tools/test-scheduler-diagnostics.py'
      - 'tools/test-native-ppc-edgecases.py'
      - 'tools/test-army-tdc-native-hotpath.py'
      - 'tools/analyze-army-tdc-boot.py'
      - 'tools/test-analyze-army-tdc-boot.py'
      - 'tools/verify-army-tdc-aot-inputs.py'
      - 'tools/test-verify-army-tdc-aot-inputs.py'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/kernel/xam/xam_content.cc'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/kernel/xevent.cc'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/cpu/compiler/passes/memory_poll_park_pass.cc'
      - 'tools/vulkan_diagnostics.py'
      - 'tools/test-vulkan-diagnostics.py'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/cpu/ppc/ppc_emit_alu.cc'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/cpu/ppc/ppc_emit_altivec.cc'
      - 'tools/test-edge30-policy.py'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/base/zephyr_edge30_policy.h'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/kernel/guest_scheduler.cc'
      - '.github/workflows/zephyr-research.yml'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/gpu/disjoint_draw_ranges.h'
      - 'emulator-core/src/test/cpp/disjoint_draw_ranges_test.cc'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/gpu/structured_jumps.h'
      - 'emulator-core/src/test/cpp/structured_jumps_test.cc'
  pull_request:
    paths:
      - 'tools/compare-benchmarks.py'
      - 'tools/test-compare-benchmarks.py'
      - 'tools/zephyr-graphics-ab.py'
      - 'tools/test-zephyr-graphics-ab.py'
      - 'tools/scheduler-diagnostics.py'
      - 'tools/test-scheduler-diagnostics.py'
      - 'tools/test-native-ppc-edgecases.py'
      - 'tools/test-army-tdc-native-hotpath.py'
      - 'tools/analyze-army-tdc-boot.py'
      - 'tools/test-analyze-army-tdc-boot.py'
      - 'tools/verify-army-tdc-aot-inputs.py'
      - 'tools/test-verify-army-tdc-aot-inputs.py'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/kernel/xam/xam_content.cc'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/kernel/xevent.cc'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/cpu/compiler/passes/memory_poll_park_pass.cc'
      - 'tools/vulkan_diagnostics.py'
      - 'tools/test-vulkan-diagnostics.py'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/cpu/ppc/ppc_emit_alu.cc'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/cpu/ppc/ppc_emit_altivec.cc'
      - 'tools/test-edge30-policy.py'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/base/zephyr_edge30_policy.h'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/kernel/guest_scheduler.cc'
      - '.github/workflows/zephyr-research.yml'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/gpu/disjoint_draw_ranges.h'
      - 'emulator-core/src/test/cpp/disjoint_draw_ranges_test.cc'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/gpu/structured_jumps.h'
      - 'emulator-core/src/test/cpp/structured_jumps_test.cc'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test benchmark comparison
        run: python3 tools/test-compare-benchmarks.py
      - name: Test graphics A/B CVAR categories
        run: python3 tools/test-zephyr-graphics-ab.py
      - name: Execute real PPC emitter semantics under UBSan
        run: python3 tools/test-native-ppc-edgecases.py
      - name: Verify Army TDC missing ordinal and hot-path trace guards
        run: python3 tools/test-army-tdc-native-hotpath.py
      - name: Test TDC XEX and scheduler log classification
        run: python3 tools/test-analyze-army-tdc-boot.py
      - name: Verify synthetic AOT input hashes and safe preflight
        run: python3 tools/test-verify-army-tdc-aot-inputs.py
      - name: Test Vulkan frame and pipeline diagnostics
        run: python3 tools/test-vulkan-diagnostics.py
      - name: Test Edge30 CPU0 phase log analysis
        run: python3 tools/test-scheduler-diagnostics.py
      - name: Test opt-in Edge30 scheduler stats and IO completion
        run: python3 tools/test-edge30-policy.py
      - name: Test shader jump analysis with sanitizers
        if: ${{ hashFiles('emulator-core/src/test/cpp/structured_jumps_test.cc') != '' }}
        run: |
          c++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I emulator-core/src/main/cpp/xenia/src \
            emulator-core/src/test/cpp/structured_jumps_test.cc -o /tmp/structured-jumps-test
          /tmp/structured-jumps-test

      - name: Test conservative draw-range tracking
        run: |
          c++ -std=c++20 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I emulator-core/src/main/cpp/xenia/src \
            emulator-core/src/test/cpp/disjoint_draw_ranges_test.cc -o /tmp/disjoint-draw-test
          /tmp/disjoint-draw-test
