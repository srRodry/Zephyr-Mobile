name: Zephyr UI checks

on:
  push:
    branches:
      - feature/zephyr-mobile-branding
  pull_request:
    paths:
      - 'app/src/**'
      - 'app/build.gradle'
      - 'emulator-core/build.gradle'
      - 'emulator-core/src/main/java/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/zephyr-ui-check.yml'
      - 'tools/*signing*'
      - 'tools/test-a64-vector-select.py'
      - 'tools/test-jit-compile-stats.py'
      - 'tools/test-a64-logical-immediate.py'
      - 'tools/compile-native-regressions.py'
      - 'tools/test-native-regression-selection.py'
      - 'tools/vulkan_diagnostics.py'
      - 'tools/test-vulkan-diagnostics.py'
      - 'tools/test-pipeline-wait-stats.py'
      - 'tools/test-gpu-completion-timeline.py'
      - 'emulator-core/src/test/cpp/gpu_completion_timeline_test.cc'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/ui/gpu_completion_timeline.h'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/ui/vulkan/vulkan_gpu_completion_timeline.*'
      - 'emulator-core/src/test/cpp/pipeline_wait_stats_test.cc'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/gpu/vulkan/**'
      - 'emulator-core/src/test/cpp/a64_logical_immediate_test.cc'
      - 'emulator-core/src/test/cpp/jit_compile_stats_test.cc'
      - 'emulator-core/src/test/cpp/a64_vector_select_test.cc'
      - 'emulator-core/src/main/cpp/xenia/src/xenia/cpu/**'
      - 'emulator-core/src/main/cpp/xenia/third_party/xbyak_aarch64/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zephyr-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-ui:
    name: Kotlin / Compose and library regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The default package list includes obsolete "tools", which sdkmanager
      # can no longer resolve. This action installs the CLI and exports its PATH.
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK dependencies
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.30.3"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test signing preflight with real keystores
        run: python3 tools/test-signing-preflight.py
      - name: Verify Zephyr launcher and localized app names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("app/src/main/res")
          android = "{http://schemas.android.com/apk/res/android}"
          required = {
              "zephyr_launcher_background",
              "zephyr_launcher_foreground",
              "zephyr_launcher_monochrome",
              "zephyr_app_icon",
          }
          for name in required:
              path = root / "drawable" / f"{name}.xml"
              node = ET.parse(path).getroot()
              assert node.tag == "vector", f"Expected vector drawable: {path}"
              assert node.findall("path"), f"Empty launcher drawable: {path}"

          for name in ("ic_launcher", "ic_launcher_round"):
              path = root / "mipmap-anydpi-v26" / f"{name}.xml"
              node = ET.parse(path).getroot()
              assert node.tag == "adaptive-icon", f"Invalid adaptive icon: {path}"
              for tag, expected in (
                  ("background", "zephyr_launcher_background"),
                  ("foreground", "zephyr_launcher_foreground"),
                  ("monochrome", "zephyr_launcher_monochrome"),
              ):
                  item = node.find(tag)
                  assert item is not None, f"{path}: missing {tag}"
                  assert item.get(android + "drawable") == "@drawable/" + expected, (
                      f"{path}: incorrect {tag} resource"
                  )

          for values in ("values", "values-pt-rBR"):
              path = root / values / "strings.xml"
              node = ET.parse(path).getroot()
              names = [s.text for s in node.findall("string") if s.get("name") == "app_name"]
              assert names == ["Zephyr-Mobile"], f"Unexpected app label: {path}: {names}"
          for filename in ("XdBlades.kt", "XdLogo.kt"):
              source = Path("app/src/main/java/xendroid/compose/ui/design") / filename
              text = source.read_text()
              assert "R.drawable.zephyr_launcher_foreground" in text, f"Missing Zephyr mark: {source}"
              assert "R.drawable.xd_logo_mark" not in text, f"Legacy mark still displayed: {source}"
          shell = (Path("app/src/main/java/xendroid/compose/ui/design") / "XdShell.kt").read_text()
          assert "ZephyrBladeRail(current, modifier)" in shell, "Touch shell must use the branded blade rail"
          assert "R.drawable.xd_logo_mark" not in shell, "Legacy mark still displayed by touch shell"
          print("Zephyr adaptive icons, shared UI marks and app labels verified.")
          PY
      - name: Test native audio performance hint lifecycle
        run: python3 tools/test-audio-performance-hint.py
      - name: Test native POSIX clock units and query overhead
        run: python3 tools/test-native-clock.py
      - name: Test ARM64 vector select semantics and instruction encoding
        run: python3 tools/test-a64-vector-select.py
      - name: Test ARM64 logical masks and unchanged materialization fallbacks
        run: python3 tools/test-a64-logical-immediate.py
      - name: Check Java and native JNI signatures
        run: python3 tools/check-jni.py
      - name: Test optional JIT compile timing lifecycle and concurrent snapshots
        run: python3 tools/test-jit-compile-stats.py
      - name: Test Vulkan diagnostic units and unavailable samples
        run: python3 tools/test-vulkan-diagnostics.py
      - name: Test optional pipeline wait timing and concurrent completion
        run: python3 tools/test-pipeline-wait-stats.py

      - name: Check CPU 0 scheduler phase diagnostics
        run: python3 tools/test-scheduler-phase-stats.py
      - name: Test GPU completion timeline and exact fence collection policy
        run: python3 tools/test-gpu-completion-timeline.py
      - name: Compile Compose UI without packaging native libraries
        run: bash ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
      # These cases deliberately replace config files and the native singleton.
      # Run them in their own test JVM, apart from navigation/idling assertions.
      - name: Test settings transfers and native failure recovery
        run: |
          bash ./gradlew :app:testUitestUnitTest --no-daemon --stacktrace \
            --tests 'xendroid.compose.screens.DataBundleExportTest' \
            --tests 'xendroid.compose.screens.ProfileLoadFailureTest' \
            --tests 'xendroid.compose.StartupRecoveryTest' \
            --tests 'xendroid.compose.core.PresenterPerformanceHintsTest'
          mkdir -p app/build/reports/tests/zephyr-transfer-tests app/build/test-results/zephyr-transfer-tests
          cp -a app/build/reports/tests/testUitestUnitTest/. app/build/reports/tests/zephyr-transfer-tests/
          cp -a app/build/test-results/testUitestUnitTest/. app/build/test-results/zephyr-transfer-tests/
      - name: Test in-game and library navigation and data persistence
        run: |
          bash ./gradlew :app:testUitestUnitTest --no-daemon --stacktrace \
            --tests 'xendroid.compose.ui.ingame.InGameMenuStateTest' \
            --tests 'xendroid.compose.ui.ingame.InGameLogPickerTest' \
            --tests 'xendroid.compose.ui.ingame.TouchGameGuideTest' \
            --tests 'xendroid.compose.ui.library.*' \
            --tests 'xendroid.compose.ui.design.ZephyrPaletteTest' \
            --tests 'xendroid.compose.ui.settings.SettingsHubRoutingTest' \
            --tests 'xendroid.compose.screens.SettingsHubTest' \
            --tests 'xendroid.compose.screens.ProfilesWorkspaceTest' \
            --tests 'xendroid.compose.gamepad.MenuButtonsTest' \
            --tests 'xendroid.compose.screens.BaseShots' \
            --tests 'xendroid.compose.screens.FirstRunReturnTest' \
            --tests 'xendroid.compose.bundle.*' \
            --tests 'xendroid.compose.saves.*' \
            --tests 'xendroid.compose.data.Profile*' \
            --tests 'xendroid.compose.settings.ConfigFileTransactionTest' \
            --tests 'xendroid.compose.compatibility.SettingsProfilesTest' \
            --tests 'xendroid.compose.sessions.HostThreadCpuTest' \
            --tests 'xendroid.compose.sessions.RunPerformanceTest' \
            --tests 'xendroid.compose.sessions.RunReportTest' \
            --tests 'xendroid.compose.core.SuccessfulInitializationTest' \
            --tests 'xendroid.compose.updater.*'
      - name: Upload library test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-library-test-reports
          path: |
            app/build/reports/tests/testUitestUnitTest/
            app/build/test-results/testUitestUnitTest/
            app/build/reports/tests/zephyr-transfer-tests/
            app/build/test-results/zephyr-transfer-tests/
          if-no-files-found: ignore
          retention-days: 14

  native-android:
    name: Android ARM64 release translation-unit integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
      XENDROID_NINJA_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test strict native object selection and failure propagation
        run: python3 tools/test-native-regression-selection.py
      - name: Install shader compiler tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ninja-build glslang-tools spirv-tools
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android native toolchain
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.30.3"
      - uses: gradle/actions/setup-gradle@v4
      # Configure the same Release CMake variant as the experimental APK, then
      # build object targets only. No assemble/package/signing/release task.
      - name: Configure Android ARM64 Release without packaging
        run: bash ./gradlew -PxendroidReleaseDebuggable ':emulator-core:configureCMakeRelease[arm64-v8a]' --no-daemon --stacktrace
      - name: Compile production CPU, GPU and JNI regression objects
        run: python3 tools/compile-native-regressions.py --jobs 2
