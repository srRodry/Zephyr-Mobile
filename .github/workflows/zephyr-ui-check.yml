name: Zephyr UI checks

on:
  push:
    branches:
      - feature/zephyr-mobile-branding
  pull_request:
    paths:
      - 'app/src/**'
      - 'app/build.gradle'
      - 'emulator-core/build.gradle'
      - 'emulator-core/src/main/java/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/zephyr-ui-check.yml'
      - 'tools/*signing*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zephyr-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-ui:
    name: Kotlin / Compose and library regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The default package list includes obsolete "tools", which sdkmanager
      # can no longer resolve. This action installs the CLI and exports its PATH.
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK dependencies
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.30.3"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test signing preflight with real keystores
        run: python3 tools/test-signing-preflight.py
      - name: Verify Zephyr launcher and localized app names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("app/src/main/res")
          android = "{http://schemas.android.com/apk/res/android}"
          required = {
              "zephyr_launcher_background",
              "zephyr_launcher_foreground",
              "zephyr_launcher_monochrome",
          }
          for name in required:
              path = root / "drawable" / f"{name}.xml"
              node = ET.parse(path).getroot()
              assert node.tag == "vector", f"Expected vector drawable: {path}"
              assert node.findall("path"), f"Empty launcher drawable: {path}"

          for name in ("ic_launcher", "ic_launcher_round"):
              path = root / "mipmap-anydpi-v26" / f"{name}.xml"
              node = ET.parse(path).getroot()
              assert node.tag == "adaptive-icon", f"Invalid adaptive icon: {path}"
              for tag, expected in (
                  ("background", "zephyr_launcher_background"),
                  ("foreground", "zephyr_launcher_foreground"),
                  ("monochrome", "zephyr_launcher_monochrome"),
              ):
                  item = node.find(tag)
                  assert item is not None, f"{path}: missing {tag}"
                  assert item.get(android + "drawable") == "@drawable/" + expected, (
                      f"{path}: incorrect {tag} resource"
                  )

          for values in ("values", "values-pt-rBR"):
              path = root / values / "strings.xml"
              node = ET.parse(path).getroot()
              names = [s.text for s in node.findall("string") if s.get("name") == "app_name"]
              assert names == ["Zephyr-Mobile"], f"Unexpected app label: {path}: {names}"
          print("Zephyr adaptive icons and app labels verified.")
          PY
      - name: Compile Compose UI without packaging native libraries
        run: bash ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Test library behavior and controller navigation
        run: |
          bash ./gradlew :app:testUitestUnitTest --no-daemon --stacktrace \
            --tests 'xendroid.compose.ui.library.*' \
            --tests 'xendroid.compose.gamepad.MenuButtonsTest' \
            --tests 'xendroid.compose.screens.BaseShots.library*' \
            --tests 'xendroid.compose.screens.FirstRunReturnTest'
      - name: Upload library test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-library-test-reports
          path: |
            app/build/reports/tests/testUitestUnitTest/
            app/build/test-results/testUitestUnitTest/
          if-no-files-found: ignore
          retention-days: 14
